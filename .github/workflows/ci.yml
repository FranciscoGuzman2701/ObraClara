name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: obraclara
          POSTGRES_PASSWORD: obraclara
          POSTGRES_DB: obraclara
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U obraclara" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://obraclara:obraclara@localhost:5432/obraclara
      TEST_DATABASE_URL: postgres://obraclara:obraclara@localhost:5432/obraclara_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compilar
        run: pnpm turbo run build --filter=!@obraclara/field
      - name: Tipos
        run: pnpm turbo run typecheck
      - name: Pruebas (reglas SQL, API contra PostgreSQL, contratos, bandeja offline)
        run: pnpm turbo run test --concurrency=1
