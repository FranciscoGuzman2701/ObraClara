name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: obraclara
          POSTGRES_PASSWORD: obraclara
          POSTGRES_DB: obraclara
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U obraclara" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://obraclara:obraclara@localhost:5432/obraclara
      TEST_DATABASE_URL: postgres://obraclara:obraclara@localhost:5432/obraclara_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compilar
        run: pnpm turbo run build --filter=!@obraclara/field
      - name: Tipos
        run: pnpm turbo run typecheck
      - name: Pruebas (reglas SQL, API contra PostgreSQL, contratos, bandeja offline)
        run: pnpm turbo run test --concurrency=1

  escritorio:
    # Motor de precios unitarios (.NET 8 + SQL Server): dominio, SQL Server real e interfaz sin pantalla
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "ObraClara#2026"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'ObraClara#2026' -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      APU_SQLSERVER: "Server=localhost,1433;User Id=sa;Password=ObraClara#2026;TrustServerCertificate=True"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build ObraClara.Apu.sln -c Release
      - run: dotnet test ObraClara.Apu.sln -c Release --no-build
