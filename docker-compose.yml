# Infraestructura local: PostgreSQL 16, Redis (colas) y MinIO (S3 compatible)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: obraclara
      POSTGRES_PASSWORD: obraclara
      POSTGRES_DB: obraclara
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U obraclara"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: obraclara
      MINIO_ROOT_PASSWORD: obraclara-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3 && mc alias set local http://minio:9000 obraclara obraclara-secret &&
                  mc mb --ignore-existing local/obraclara-evidencias"
volumes:
  pgdata:
  miniodata:
